<style>
.contact-intro{position:fixed;inset:0;z-index:999999;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 42%,#27392ee8,#080b0af5 72%);pointer-events:none;overflow:hidden;animation:contact-overlay 2.7s ease both;}
.contact-scene{width:min(580px,92vw);height:min(620px,90vh);position:relative;display:grid;place-items:center;}
.contact-ufo{position:absolute;top:8%;width:100%;height:45%;filter:drop-shadow(0 0 26px #b8cfaa55);animation:contact-flight 2.7s cubic-bezier(.2,.7,.3,1) both;}
.contact-beam{position:absolute;top:35%;width:70%;height:57%;background:linear-gradient(#f0e7bd77,#d2dcb41a 70%,transparent);clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);animation:contact-light 2.7s ease both;}
.contact-alien{position:absolute;top:47%;width:24%;height:29%;filter:drop-shadow(0 0 16px #d8d4a345);animation:contact-visitor 2.7s ease both;}
.contact-message{position:absolute;bottom:6%;color:#e8ddc5;font:14px Georgia,serif;letter-spacing:5px;text-align:center;text-transform:uppercase;animation:contact-light 2.7s ease both;}
@keyframes contact-overlay{0%{opacity:0;visibility:visible}12%,80%{opacity:1}100%{opacity:0;visibility:hidden}}
@keyframes contact-flight{0%{transform:translate(-100vw,-40vh) rotate(-18deg) scale(.3)}24%,72%{transform:translate(0,0) rotate(0) scale(1)}100%{transform:translate(90vw,-90vh) rotate(16deg) scale(.25)}}
@keyframes contact-light{0%,20%{opacity:0}32%,73%{opacity:1}90%,100%{opacity:0}}
@keyframes contact-visitor{0%,30%{opacity:0;transform:translateY(65px) scale(.65)}46%,69%{opacity:1;transform:translateY(0) scale(1)}84%,100%{opacity:0;transform:translateY(-120px) scale(.3)}}
@media(prefers-reduced-motion:reduce){.contact-ufo,.contact-alien{animation:none}.contact-overlay{animation:contact-overlay 1s ease both}.contact-intro{animation-duration:1s}.contact-beam,.contact-message{animation:none}.contact-alien{opacity:1}}
</style>
<div class="contact-intro" aria-hidden="true">
 <div class="contact-scene">
  <div class="contact-beam"></div>
  <svg class="contact-ufo" viewBox="0 0 600 260" xmlns="http://www.w3.org/2000/svg">
   <defs><linearGradient id="contact-hull" x2="0" y2="1"><stop stop-color="#647064"/><stop offset=".5" stop-color="#242d28"/><stop offset="1" stop-color="#101814"/></linearGradient><radialGradient id="contact-window"><stop stop-color="#c6d3b7"/><stop offset="1" stop-color="#46534a"/></radialGradient></defs>
   <path d="M192 132 Q200 33 300 30 Q400 33 408 132" fill="url(#contact-window)" stroke="#b7baa2" stroke-width="2"/>
   <path d="M72 130 Q300 51 528 130 Q585 163 300 223 Q15 163 72 130Z" fill="url(#contact-hull)" stroke="#929a84" stroke-width="3"/>
   <ellipse cx="300" cy="133" rx="244" ry="39" fill="url(#contact-hull)" stroke="#a6af94" stroke-width="2"/>
   <ellipse cx="300" cy="181" rx="68" ry="15" fill="#f5eac9"/>
   <g fill="#e8ddc5"><ellipse cx="120" cy="145" rx="13" ry="5"/><ellipse cx="205" cy="160" rx="13" ry="5"/><ellipse cx="395" cy="160" rx="13" ry="5"/><ellipse cx="480" cy="145" rx="13" ry="5"/></g>
  </svg>
  <svg class="contact-alien" viewBox="0 0 130 180" xmlns="http://www.w3.org/2000/svg">
   <path d="M36 178 Q28 128 48 114 L82 114 Q102 128 94 178" fill="#657e68"/>
   <path d="M14 51 Q8 2 65 3 Q122 2 116 51 Q109 98 65 122 Q21 98 14 51Z" fill="#a8b998" stroke="#cdd0af" stroke-width="2"/>
   <path d="M24 40 Q58 43 57 76 Q26 73 24 40Z" fill="#0d1512"/><path d="M106 40 Q72 43 73 76 Q104 73 106 40Z" fill="#0d1512"/>
   <path d="M55 95 Q65 101 75 95" fill="none" stroke="#435640" stroke-width="3" stroke-linecap="round"/>
   <path d="M93 142 Q118 124 114 102 M114 112 L103 104 M114 112 L121 99" fill="none" stroke="#a8b998" stroke-width="8" stroke-linecap="round"/>
  </svg>
  <div class="contact-message">Contacto establecido<br><small style="font-size:10px;letter-spacing:3px;line-height:3">La verdad está ahí fuera…</small></div>
 </div>
</div>
