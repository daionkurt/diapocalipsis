<style>
.contact-intro{position:fixed;inset:0;z-index:999999;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 42%,#27392ee8,#080b0af5 72%);pointer-events:none;overflow:hidden;animation:contact-overlay 5s ease both;}
.contact-scene{width:min(680px,96vw);height:min(640px,90vh);position:relative;}
.contact-craft{position:absolute;top:0;width:100%;height:45%;filter:drop-shadow(0 0 26px #b8cfaa55);animation:contact-flight 5s cubic-bezier(.2,.7,.3,1) both;}
.contact-ufo{position:absolute;top:24%;width:100%;height:80%;z-index:2;}
.contact-pilot{position:absolute;top:7%;left:42.5%;width:15%;height:45%;object-fit:contain;z-index:1;}
.contact-beam{position:absolute;top:38%;left:5%;width:90%;height:46%;background:linear-gradient(#f0e7bd99,#d2dcb422 80%,transparent);clip-path:polygon(44% 0,56% 0,100% 100%,0 100%);animation:contact-light 5s ease both;}
.contact-monster{position:absolute;left:var(--start);bottom:20%;width:14%;height:25%;filter:drop-shadow(0 5px 10px #0008);animation:monster-abduction 5s ease-in both;animation-delay:var(--delay);}
.contact-monster img{width:100%;height:100%;object-fit:contain;}
.contact-ground{position:absolute;left:4%;right:4%;bottom:19%;height:1px;background:linear-gradient(90deg,transparent,#c1c5a66b,transparent);animation:contact-light 5s ease both;}
.contact-message{position:absolute;left:0;right:0;bottom:5%;color:#e8ddc5;font:14px Georgia,serif;letter-spacing:4px;text-align:center;text-transform:uppercase;animation:contact-light 5s ease both;}
@keyframes contact-overlay{0%{opacity:0;visibility:visible}10%,87%{opacity:1}100%{opacity:0;visibility:hidden}}
@keyframes contact-flight{0%{transform:translate(-100vw,-40vh) rotate(-18deg) scale(.3)}20%,80%{transform:translate(0,0) rotate(0) scale(1)}100%{transform:translate(90vw,-90vh) rotate(16deg) scale(.25)}}
@keyframes contact-light{0%,18%{opacity:0}26%,76%{opacity:1}84%,100%{opacity:0}}
@keyframes monster-abduction{0%,30%{left:var(--start);bottom:20%;opacity:1;transform:rotate(0) scale(1)}48%{left:calc((var(--start) + 43%) / 2);bottom:39%;opacity:1;transform:rotate(var(--tilt)) scale(.75)}64%,100%{left:43%;bottom:64%;opacity:0;transform:rotate(0) scale(.06)}}
@media(max-width:480px){.contact-message{font-size:11px;letter-spacing:2px}.contact-monster{width:15%;height:23%}}
@media(prefers-reduced-motion:reduce){.contact-craft,.contact-monster,.contact-beam,.contact-message,.contact-ground{animation:none}.contact-intro{animation-duration:1s}}
</style>
<div class="contact-intro" aria-hidden="true">
 <div class="contact-scene">
  <div class="contact-beam"></div>
  <div class="contact-ground"></div>
  <div class="contact-monster" style="--start:1%;--delay:0s;--tilt:-18deg"><img src="{{WEREWOLF_IMAGE}}" alt=""/></div>
  <div class="contact-monster" style="--start:18%;--delay:.15s;--tilt:12deg"><img src="{{VAMPIRE_IMAGE}}" alt=""/></div>
  <div class="contact-monster" style="--start:35%;--delay:.3s;--tilt:-14deg"><img src="{{WITCH_IMAGE}}" alt=""/></div>
  <div class="contact-monster" style="--start:52%;--delay:.45s;--tilt:19deg"><img src="{{CRYPTID_IMAGE}}" alt=""/></div>
  <div class="contact-monster" style="--start:69%;--delay:.6s;--tilt:-15deg"><img src="{{GHOST_IMAGE}}" alt=""/></div>
  <div class="contact-monster" style="--start:85%;--delay:.75s;--tilt:14deg"><img src="{{MUMMY_IMAGE}}" alt=""/></div>
  <div class="contact-craft">
   <img class="contact-pilot" src="{{ALIEN_IMAGE}}" alt=""/>
   <img class="contact-ufo" src="{{UFO_IMAGE}}" alt=""/>
  </div>
  <div class="contact-message">Hasta los monstruos tienen secretos…<br><small style="font-size:10px;letter-spacing:3px;line-height:3">Iniciando abducción</small></div>
 </div>
</div>
